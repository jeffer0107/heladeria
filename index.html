<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invitación - A Y M A</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        /* Estilos Globales */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Crimson Text', serif;
        }

        /* Pantallas */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
            z-index: 1;
        }
        .screen.active {
            opacity: 1;
            pointer-events: all;
            z-index: 2;
        }

        /* Fondos e Imágenes */
        .bg-img {
            position: absolute;
            top: -2%; left: -2%;
            width: 104%; height: 104%; /* Margen extra para el efecto bobbing sin ver bordes */
            background-size: cover;
            background-position: center center;
            z-index: 1;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Contenedor de Animación de Caminar */
        .bob-container {
            width: 100%; height: 100%;
            animation: bobbing 3s infinite ease-in-out;
        }
        @keyframes bobbing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(12px); }
        }

        /* Botones Principales */
        .btn-action {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            background: rgba(15, 5, 5, 0.85);
            border: 1px solid #c9a050;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(201, 160, 80, 0.4), inset 0 0 10px rgba(201, 160, 80, 0.2);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 10;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .btn-action:hover, .btn-action:active {
            background: rgba(30, 10, 10, 0.95);
            box-shadow: 0 0 30px rgba(201, 160, 80, 0.7), inset 0 0 15px rgba(201, 160, 80, 0.4);
            text-shadow: 0 0 5px #fff;
        }

        /* Overlay y Pergamino */
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            z-index: 100;
            backdrop-filter: blur(3px);
        }
        #overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .parchment {
            background-color: #e8d0a9; /* Tono crema/ámbar */
            background-image: radial-gradient(circle, #f4e4bc 0%, #d4b886 100%);
            border: 2px solid #8b5a2b;
            box-shadow: 
                inset 0 0 50px rgba(139, 90, 43, 0.4),
                0 15px 40px rgba(0, 0, 0, 0.9);
            width: 85%;
            max-width: 450px;
            padding: 40px 25px;
            text-align: center;
            position: relative;
            color: #3e2723;
        }
        /* Bordes enrollados del pergamino */
        .parchment::before, .parchment::after {
            content: '';
            position: absolute;
            left: -10px; right: -10px;
            height: 25px;
            background: linear-gradient(to bottom, #d4b886, #8b5a2b);
            border: 2px solid #5d4037;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .parchment::before { top: -15px; }
        .parchment::after { bottom: -15px; background: linear-gradient(to top, #d4b886, #8b5a2b); }

        .symbol {
            font-size: 2.5rem;
            color: #5d4037;
            margin-bottom: 10px;
        }
        .parchment h1 {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.35em;
            margin: 0 0 20px 0;
            font-size: 2rem;
            color: #2e1d16;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.4);
        }
        .parchment hr {
            border: 0;
            height: 1px;
            background: #8b5a2b;
            margin: 20px auto;
            width: 60%;
            opacity: 0.6;
        }
        .parchment p {
            font-size: 1.3rem;
            line-height: 1.6;
            margin: 15px 0;
            font-style: italic;
        }

        .btn-close {
            margin-top: 30px;
            padding: 8px 20px;
            font-family: 'Crimson Text', serif;
            font-size: 1.1rem;
            color: #4e342e;
            background: transparent;
            border: 1px solid #8b5a2b;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-close:hover {
            background: rgba(139, 90, 43, 0.15);
            color: #2e1d16;
        }
    </style>
</head>
<body>

    <!-- Pantalla 1: Fogata y Dragón -->
    <div id="screen1" class="screen active">
        <div class="bg-img" id="bg1"></div>
        <canvas id="canvas1"></canvas>
        <button id="btn1" class="btn-action">⚔ Emprender el camino</button>
    </div>

    <!-- Pantalla 2: Caminando al Castillo -->
    <div id="screen2" class="screen">
        <div class="bob-container">
            <div class="bg-img" id="bg2"></div>
            <canvas id="canvas2"></canvas>
        </div>
        <button id="btn2" class="btn-action">✦ Leer el pergamino</button>
    </div>

    <!-- Overlay Pergamino -->
    <div id="overlay">
        <div class="parchment">
            <div class="symbol">⚜</div>
            <h1>A Y M A</h1>
            <hr/>
            <p>Quedás invitada a unirte a una expedición nocturna bajo las estrellas.</p>
            <p>
                El terreno: desconocido.<br>
                El destino: una heladería.<br>
                La misión: que el destino deje de ponernos excusas.
            </p>
            <button id="close-btn" class="btn-close">cerrar el pergamino</button>
        </div>
    </div>

    <script>
        /**
         * ==========================================
         * CONFIGURACIÓN DE ARCHIVOS / BASE 64
         * ==========================================
         * Para hacer este HTML 100% offline, reemplaza el contenido 
         * entre comillas con tu cadena Base64 ("data:image/png;base64,...")
         */
        const ASSETS = {
            bg1: "Gemini_Generated_Image_7scsdr7scsdr7scs.png", 
            bg2: "1.png", 
            audio: "Love Story X Golden Brown (Live).mp3"
        };

        // Asignar fondos
        document.getElementById('bg1').style.backgroundImage = `url('${ASSETS.bg1}')`;
        document.getElementById('bg2').style.backgroundImage = `url('${ASSETS.bg2}')`;

        // Elementos y variables globales
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const overlay = document.getElementById('overlay');
        const canvas1 = document.getElementById('canvas1');
        const canvas2 = document.getElementById('canvas2');
        const ctx1 = canvas1.getContext('2d');
        const ctx2 = canvas2.getContext('2d');

        let currentScreen = 1;
        let time = 0;
        let sparks = [];
        let stars1 = [];
        let stars2 = [];

        // Audio Setup
        const bgAudio = new Audio(ASSETS.audio);
        bgAudio.loop = true;
        bgAudio.volume = 0;

        // Ajustar Canvas al tamaño de pantalla
        function resizeCanvas() {
            canvas1.width = window.innerWidth;
            canvas1.height = window.innerHeight;
            canvas2.width = window.innerWidth;
            canvas2.height = window.innerHeight;
            initStars();
        }
        window.addEventListener('resize', resizeCanvas);

        // Inicializar Estrellas (Cálidas para S1, Frías para S2)
        function initStars() {
            stars1 = [];
            stars2 = [];
            const numStars = window.innerWidth < 600 ? 60 : 120; // Menos estrellas en móvil para rendimiento
            
            for(let i=0; i < numStars; i++) {
                // Estrellas pantalla 1
                stars1.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight * 0.5, // Mitad superior
                    size: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: (Math.random() * 0.015) + 0.005
                });
                // Estrellas pantalla 2
                stars2.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight * 0.6,
                    size: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    speed: (Math.random() * 0.015) + 0.005
                });
            }
        }

        // Crear brasas de la fogata
        function createSpark() {
            sparks.push({
                x: window.innerWidth * 0.5 + (Math.random() * 60 - 30), // Centro horizontal
                y: window.innerHeight * 0.85, // Abajo
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() * -2) - 1.5,
                life: 1,
                decay: Math.random() * 0.015 + 0.01,
                size: Math.random() * 3 + 1
            });
        }

        // Render Pantalla 1 (Fogata, Dragón, Brasas)
        function renderScreen1() {
            if (currentScreen !== 1) return;
            ctx1.clearRect(0, 0, canvas1.width, canvas1.height);

            // Brillo pulsante del Dragón (como si respirara) y Fogata
            const pulse = Math.sin(time * 0.04) * 0.15 + 0.85; // 0.7 to 1.0
            
            // Fogata Glow (Centro Abajo)
            ctx1.globalCompositeOperation = 'screen';
            let fireGlow = ctx1.createRadialGradient(
                canvas1.width * 0.5, canvas1.height * 0.85, 10,
                canvas1.width * 0.5, canvas1.height * 0.85, canvas1.width * 0.6
            );
            fireGlow.addColorStop(0, `rgba(255, 100, 0, ${pulse * 0.4})`);
            fireGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx1.fillStyle = fireGlow;
            ctx1.fillRect(0, 0, canvas1.width, canvas1.height);

            // Dragón Shimmer (General ambiental cálido)
            let dragonGlow = ctx1.createRadialGradient(
                canvas1.width * 0.5, canvas1.height * 0.5, 50,
                canvas1.width * 0.5, canvas1.height * 0.5, canvas1.width * 0.8
            );
            dragonGlow.addColorStop(0, `rgba(200, 50, 10, ${Math.abs(Math.sin(time*0.02)) * 0.15})`);
            dragonGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx1.fillStyle = dragonGlow;
            ctx1.fillRect(0, 0, canvas1.width, canvas1.height);

            // Estrellas cálidas parpadeando
            ctx1.globalCompositeOperation = 'source-over';
            ctx1.fillStyle = '#ffebd6';
            stars1.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed *= -1;
                ctx1.globalAlpha = Math.max(0, Math.min(1, star.alpha));
                ctx1.beginPath();
                ctx1.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx1.fill();
            });

            // Brasas subiendo
            if (Math.random() < 0.5) createSpark(); // Generador
            ctx1.globalCompositeOperation = 'lighter';
            for(let i = sparks.length - 1; i >= 0; i--) {
                let s = sparks[i];
                s.x += s.vx;
                s.y += s.vy;
                s.life -= s.decay;

                if (s.life <= 0) {
                    sparks.splice(i, 1);
                    continue;
                }

                ctx1.globalAlpha = Math.max(0, s.life);
                ctx1.fillStyle = '#ffaa00';
                ctx1.beginPath();
                ctx1.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx1.fill();
            }

            ctx1.globalAlpha = 1;
            ctx1.globalCompositeOperation = 'source-over';
            time++;
            requestAnimationFrame(renderScreen1);
        }

        // Render Pantalla 2 (Luna, Castillo, Camino)
        function renderScreen2() {
            if (currentScreen !== 2) return;
            ctx2.clearRect(0, 0, canvas2.width, canvas2.height);

            // Estrellas frías parpadeando
            ctx2.fillStyle = '#d4eeff';
            stars2.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed *= -1;
                ctx2.globalAlpha = Math.max(0, Math.min(1, star.alpha));
                ctx2.beginPath();
                ctx2.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx2.fill();
            });

            ctx2.globalCompositeOperation = 'screen';
            
            // Brillo de la Luna (Arriba centro/izquierda)
            let moonPulse = Math.sin(time * 0.03) * 0.1 + 0.9;
            let moonGlow = ctx2.createRadialGradient(
                canvas2.width * 0.45, canvas2.height * 0.2, 20,
                canvas2.width * 0.45, canvas2.height * 0.2, canvas2.width * 0.5
            );
            moonGlow.addColorStop(0, `rgba(180, 220, 255, ${moonPulse * 0.3})`);
            moonGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx2.fillStyle = moonGlow;
            ctx2.fillRect(0, 0, canvas2.width, canvas2.height);

            // Brillo cálido del Castillo (Arriba derecha)
            let castlePulse = Math.sin(time * 0.08) * 0.15 + 0.85;
            let castleGlow = ctx2.createRadialGradient(
                canvas2.width * 0.75, canvas2.height * 0.35, 10,
                canvas2.width * 0.75, canvas2.height * 0.35, canvas2.width * 0.4
            );
            castleGlow.addColorStop(0, `rgba(255, 160, 50, ${castlePulse * 0.35})`);
            castleGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx2.fillStyle = castleGlow;
            ctx2.fillRect(0, 0, canvas2.width, canvas2.height);

            ctx2.globalCompositeOperation = 'source-over';
            ctx2.globalAlpha = 1;
            time++;
            requestAnimationFrame(renderScreen2);
        }

        // Interacciones y Lógica de Transición
        function playAudioGradual() {
            bgAudio.play().then(() => {
                let vol = 0;
                let fadeInterval = setInterval(() => {
                    vol += 0.02;
                    if (vol >= 0.55) {
                        bgAudio.volume = 0.55;
                        clearInterval(fadeInterval);
                    } else {
                        bgAudio.volume = vol;
                    }
                }, 100);
            }).catch(e => {
                // Falla silenciosa si el navegador bloquea autoplay
                console.log("Audio omitido por políticas del navegador.");
            });
        }

        document.getElementById('btn1').addEventListener('click', () => {
            // Iniciar Audio
            playAudioGradual();

            // Transición a Pantalla 2
            screen1.classList.remove('active');
            screen2.classList.add('active');
            currentScreen = 2;
            requestAnimationFrame(renderScreen2);
        });

        document.getElementById('btn2').addEventListener('click', () => {
            overlay.classList.add('active');
        });

        document.getElementById('close-btn').addEventListener('click', () => {
            overlay.classList.remove('active');
        });

        // Setup Inicial
        resizeCanvas();
        requestAnimationFrame(renderScreen1);

    </script>
</body>
</html>
